name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; the publish job elevates id-token for provenance.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance` to mint a Sigstore OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts: no dependency here declares an install lifecycle script,
      # so refusing to run them removes an injection path into dist/ at no cost.
      # It is deliberately not passed to `npm publish`, which must still run the
      # prepublishOnly gate.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Registry signatures and provenance attestations for everything that went
      # into this build. Full tree: the production tree is empty and npm treats an
      # empty audit target as an error.
      - name: Verify registry signatures
        run: npm audit signatures

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # E2E tests are skipped when DEEPL_API_KEY is not set
          DEEPL_API_KEY: ""

      - name: Verify no path aliases in dist
        run: "! grep -r 'require(\"@/' dist/"

      # Guards against tagging v1.2.3 while package.json still says 1.2.2.
      - name: Verify package version matches release tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match release tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
