name: CI

on:
  # No branch filter: `branches:` matches the BASE, so filtering it would
  # leave a stacked PR — one based on another feature branch — with zero
  # checks. Every pull request is checked, whatever it targets.
  pull_request:
  # `main` only. A push to `dev` is always a merge of a PR that was already
  # checked against `dev`, so listing it here only re-ran the same commit —
  # twice over on a release PR, whose head branch IS `dev`.
  push:
    branches: [main]

# Least privilege by default; no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; a push to `main` is not, so
  # every commit on the published branch keeps its own completed run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The declared floor and the current Active LTS. 22.12 is pinned exactly
        # because plain `22` resolves to the latest 22.x, which would run an API
        # added after the floor without complaint — and npm enforces `engines` on
        # the consumer's side, so that break is theirs, not ours.
        #
        # Nothing covers the span between 22.12 and latest 22.x. That is a known
        # gap, accepted rather than overlooked: the library touches four Node APIs
        # (`node:path`, `node:fs/promises`, `fetch`, `AbortController`) and has no
        # runtime dependencies, so a regression confined to a 22.x patch and absent
        # from 24 has very little to land on. Add the leg back if that stops being
        # true.
        node-version: ['22.12', 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # E2E tests are skipped when DEEPL_API_KEY is not set
          DEEPL_API_KEY: ""

      - name: Verify no path aliases in dist
        run: "! grep -r 'require(\"@/' dist/"

  # One coverage run, not one per matrix leg: three uploads of the same commit race
  # in Codecov and the last writer wins. The thresholds in `vitest.config.ts` are the
  # real gate — this job fails on a coverage drop whether or not the upload succeeds.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates this workflow over OIDC, the way npm does on publish,
      # so no upload token is stored in the repository.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # No build step: the suite runs against `src/` through the `@/` alias.
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          # E2E tests are skipped when DEEPL_API_KEY is not set
          DEEPL_API_KEY: ""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          # A Codecov outage must not fail a pull request. The threshold gate in the
          # step above is what protects coverage; this only publishes the number.
          fail_ci_if_error: false

  # Proves the support claims in the README instead of trusting a hand-edited badge:
  # the published declarations must compile on every TypeScript version we advertise,
  # and the package must resolve correctly for CJS, ESM and bundler consumers.
  compat:
    name: Compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor from `engines`, so the declared minimum is the one exercised.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Type-check a consumer across the supported TypeScript range
        run: npm run compat:types

      - name: Check the published package resolves for every consumer shape
        run: npm run compat:package

  # A packed tarball installed into a scratch project and driven end to end: missing
  # key -> stub provider over HTTP -> live i18next instance -> YAML file. `compat`
  # checks that the package resolves; this checks that it runs, through the same
  # `node_modules` a consumer gets. It found a re-entrancy bug the unit suite could
  # not see, because its i18next mock never reported a miss back to the handler.
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor from `engines`, so the declared minimum is the one exercised.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Install the packed tarball and run a consumer against it
        run: npm run smoke
