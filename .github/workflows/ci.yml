name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege by default; no job here needs more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # E2E tests are skipped when DEEPL_API_KEY is not set
          DEEPL_API_KEY: ""

      - name: Verify no path aliases in dist
        run: "! grep -r 'require(\"@/' dist/"

  # Proves the support claims in the README instead of trusting a hand-edited badge:
  # the published declarations must compile on every TypeScript version we advertise,
  # and the package must resolve correctly for CJS, ESM and bundler consumers.
  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # The floor from `engines`, so the declared minimum is the one exercised.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Type-check a consumer across the supported TypeScript range
        run: npm run compat:types

      - name: Check the published package resolves for every consumer shape
        run: npm run compat:package
