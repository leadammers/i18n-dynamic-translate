name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege by default; no job here needs more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # E2E tests are skipped when DEEPL_API_KEY is not set
          DEEPL_API_KEY: ""

      - name: Verify no path aliases in dist
        run: "! grep -r 'require(\"@/' dist/"
