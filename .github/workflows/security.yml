name: Security

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    # Weekly full re-scan so newly published advisories surface without a push.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Dependency vulnerability scanning
  # ---------------------------------------------------------------------------
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # Lifecycle scripts are the main supply-chain injection vector, and no
      # dependency in this tree declares one, so skipping them costs nothing.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runtime surface of the published package. This is what consumers install.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full tree including devDependencies (build/test tooling).
      - name: Audit all dependencies
        run: npm audit --audit-level=high

      # `npm audit` only consults the advisory database. This verifies the
      # registry's signatures and provenance attestations, catching tampered or
      # unsigned publishes. Runs on the full tree: npm errors out when the audit
      # target is empty, and the production tree has no dependencies.
      - name: Verify registry signatures
        run: npm audit signatures

  # ---------------------------------------------------------------------------
  # Static analysis (SAST)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning on a private repository requires GitHub Code Security, so the
    # SARIF upload is rejected and the job fails however well the scan itself runs.
    # Skipping while private keeps the check honest; it starts running by itself
    # once the repository is made public, with no change needed here.
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"

  # ---------------------------------------------------------------------------
  # Secret scanning (working tree + full git history)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API on pull_request runs.
      # Without this it fails with 403 "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history so rewritten/old commits are scanned too, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for GitHub organisation accounts; free for personal accounts
          # and public repositories. Unset is fine in those cases.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Findings must never be echoed anywhere a secret value could leak:
          # no SARIF artifact upload, no PR comments containing the match.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Job summary lists rule/file/commit only - no secret values.
          GITLEAKS_ENABLE_SUMMARY: "true"
