version: 2

updates:
  # Application/library dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: dev
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for routine dev tooling bumps instead of five.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # The actions used by the workflows in this repo (pinned to SHAs, so
  # Dependabot is what keeps those pins current).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
